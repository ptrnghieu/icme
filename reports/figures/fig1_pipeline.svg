<svg xmlns='http://www.w3.org/2000/svg' width='970' height='330' viewBox='0 0 970 330'><rect width='970' height='330' fill='#ffffff'/><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#666666'/></marker></defs><text x='20' y='28' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#191919' text-anchor='start' font-weight='bold'>Figure 1. Inference pipeline. Stages A-B follow the official OV-MER protocol; stage C (CONSTRUCT) is our contribution.</text><rect x='20' y='60' width='140' height='120' rx='8' fill='#f5f7fa' stroke='#c9d1db' stroke-width='1.5'/><text x='90.0' y='82' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#191919' text-anchor='middle' font-weight='bold'>Clip x</text><text x='90.0' y='102' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>video frames</text><text x='90.0' y='119' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>audio track</text><text x='90.0' y='136' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>English subtitle</text><line x1='160' y1='120' x2='205' y2='120' stroke='#666666' stroke-width='2' marker-end='url(#ah)'/><rect x='205' y='50' width='215' height='140' rx='8' fill='#f5f7fa' stroke='#c9d1db' stroke-width='1.5'/><text x='312.5' y='72' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#191919' text-anchor='middle' font-weight='bold'>A. Describe</text><text x='312.5' y='92' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>Qwen2.5-Omni-7B (zero-shot)</text><text x='312.5' y='109' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>official OV-MER prompt</text><text x='312.5' y='126' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>1 greedy + N sampled</text><text x='312.5' y='143' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>descriptions (T=1.0, top-p 0.95)</text><text x='312.5' y='160' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>cut invented 'Human:' turns</text><line x1='420' y1='120' x2='480' y2='120' stroke='#666666' stroke-width='2' marker-end='url(#ah)'/><text x='450' y='108' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#666666' text-anchor='middle' font-weight='normal' font-style='italic'>N+1</text><text x='450' y='140' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#666666' text-anchor='middle' font-weight='normal' font-style='italic'>texts</text><rect x='480' y='50' width='215' height='140' rx='8' fill='#f5f7fa' stroke='#c9d1db' stroke-width='1.5'/><text x='587.5' y='72' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#191919' text-anchor='middle' font-weight='bold'>B. Extract</text><text x='587.5' y='92' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>Qwen2.5-7B-Instruct (vLLM)</text><text x='587.5' y='109' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>official extraction prompt</text><text x='587.5' y='126' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>(&lt;= 4 labels per description)</text><text x='587.5' y='143' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>T=0.7, top-p 0.8</text><text x='587.5' y='160' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>-&gt; one label list per text</text><line x1='695' y1='120' x2='745' y2='120' stroke='#666666' stroke-width='2' marker-end='url(#ah)'/><text x='720' y='108' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#666666' text-anchor='middle' font-weight='normal' font-style='italic'>S_1..S_N</text><rect x='745' y='50' width='205' height='140' rx='8' fill='#eaf2fd' stroke='#257de0' stroke-width='2.5'/><text x='847.5' y='72' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#257de0' text-anchor='middle' font-weight='bold'>C. CONSTRUCT</text><text x='847.5' y='92' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>build candidate pool</text><text x='847.5' y='109' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>Monte Carlo expected EW-F</text><text x='847.5' y='126' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>R(Y) = mean_i U(Y, S_i)</text><text x='847.5' y='143' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>greedy set construction</text><text x='847.5' y='160' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>-&gt; final label set Y*</text><line x1='847' y1='190' x2='847' y2='230' stroke='#666666' stroke-width='2' marker-end='url(#ah)'/><rect x='690' y='230' width='260' height='70' rx='8' fill='#f5f7fa' stroke='#c9d1db' stroke-width='1.5'/><text x='820.0' y='252' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#191919' text-anchor='middle' font-weight='bold'>EW-F evaluation (official)</text><text x='820.0' y='272' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>map labels to emotion-wheel groups,</text><text x='820.0' y='289' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='middle' font-weight='normal'>P / R / F over the corpus, 5 wheels</text><text x='20' y='240' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#191919' text-anchor='start' font-weight='bold'>Example (one clip, N = 4):</text><text x='30' y='265' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='start' font-weight='normal'>S_1:  {worried, sad, angry}</text><text x='30' y='283' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='start' font-weight='normal'>S_2:  {worried, sad, surprised}</text><text x='30' y='301' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='start' font-weight='normal'>S_3:  {worried, sad, happy}</text><text x='30' y='319' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='start' font-weight='normal'>S_4:  {worried, sad, disgusted}</text><text x='330' y='265' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='start' font-weight='normal'>Best single list (MBR):  0.75</text><text x='330' y='283' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#257de0' text-anchor='start' font-weight='bold'>CONSTRUCT {worried, sad}:  0.80</text><text x='330' y='301' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#666666' text-anchor='start' font-weight='normal' font-style='italic'>(expected F, one-wheel toy example)</text></svg>