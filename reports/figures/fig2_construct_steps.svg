<svg xmlns='http://www.w3.org/2000/svg' width='920' height='380' viewBox='0 0 920 380'><rect width='920' height='380' fill='#ffffff'/><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#666666'/></marker></defs><text x='20' y='28' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#191919' text-anchor='start' font-weight='bold'>Figure 2. CONSTRUCT on the toy clip of Fig. 1: candidates and Monte Carlo expected score per step.</text><text x='20' y='76' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='start' font-weight='normal'>step 1</text><text x='285' y='76' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#191919' text-anchor='end' font-weight='bold'>{worried}</text><rect x='300' y='60' width='240.0' height='22' rx='4' fill='#257de0'/><text x='546.0' y='76' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#191919' text-anchor='start' font-weight='bold'>0.500  &lt;- kept</text><text x='20' y='106' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='start' font-weight='normal'>step 1</text><text x='285' y='106' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#191919' text-anchor='end' font-weight='normal'>{sad}</text><rect x='300' y='90' width='240.0' height='22' rx='4' fill='#b6c6d8'/><text x='546.0' y='106' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#191919' text-anchor='start' font-weight='normal'>0.500</text><text x='20' y='136' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='start' font-weight='normal'>step 1</text><text x='285' y='136' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#191919' text-anchor='end' font-weight='normal'>{angry}</text><rect x='300' y='120' width='60.0' height='22' rx='4' fill='#b6c6d8'/><text x='366.0' y='136' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#191919' text-anchor='start' font-weight='normal'>0.125</text><text x='20' y='178' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='start' font-weight='normal'>step 2</text><text x='285' y='178' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#191919' text-anchor='end' font-weight='bold'>{worried, sad}</text><rect x='300' y='162' width='384.0' height='22' rx='4' fill='#257de0'/><text x='690.0' y='178' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#191919' text-anchor='start' font-weight='bold'>0.800  &lt;- kept</text><text x='20' y='208' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='start' font-weight='normal'>step 2</text><text x='285' y='208' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#191919' text-anchor='end' font-weight='normal'>{worried, angry}</text><rect x='300' y='192' width='240.0' height='22' rx='4' fill='#b6c6d8'/><text x='546.0' y='208' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#191919' text-anchor='start' font-weight='normal'>0.500</text><text x='20' y='238' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='start' font-weight='normal'>step 2</text><text x='285' y='238' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#191919' text-anchor='end' font-weight='normal'>{worried, anxious*}</text><rect x='300' y='222' width='240.0' height='22' rx='4' fill='#b6c6d8'/><text x='546.0' y='238' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#191919' text-anchor='start' font-weight='normal'>0.500</text><text x='20' y='280' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='start' font-weight='normal'>step 3</text><text x='285' y='280' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#191919' text-anchor='end' font-weight='normal'>{worried, sad, angry}</text><rect x='300' y='264' width='360.0' height='22' rx='4' fill='#b6c6d8'/><text x='666.0' y='280' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#191919' text-anchor='start' font-weight='normal'>0.750</text><text x='20' y='310' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#666666' text-anchor='start' font-weight='normal'>step 3</text><text x='285' y='310' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#191919' text-anchor='end' font-weight='normal'>{worried, sad, happy}</text><rect x='300' y='294' width='360.0' height='22' rx='4' fill='#b6c6d8'/><text x='666.0' y='310' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#191919' text-anchor='start' font-weight='normal'>0.750</text><text x='20' y='345' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#666666' text-anchor='start' font-weight='normal' font-style='italic'>Step 1 tie (worried = sad) is broken by sample frequency. Stop: no step-3 addition beats 0.800, so Y* = {worried, sad}. *'anxious' = same group as 'worried'.</text><text x='20' y='362' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#666666' text-anchor='start' font-weight='normal' font-style='italic'>Scores: one wheel; per-sample F = 2|G(S) ∩ G(Y)| / (|G(S)| + |G(Y)|), averaged over the four samples of Fig. 1.</text></svg>